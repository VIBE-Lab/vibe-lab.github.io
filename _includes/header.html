<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem("vibe-theme");
      if (savedTheme === "dark") {
        document.body.classList.add("vibe-theme-dark");
      }
    } catch (error) {}
  })();
</script>

<script>
  (function () {
    function setTheme(theme) {
      var dark = theme === "dark";
      document.body.classList.toggle("vibe-theme-dark", dark);
      var label = document.querySelector(".vibe-theme-label");
      if (label) {
        label.textContent = dark ? "Dark" : "Light";
      }
      try {
        localStorage.setItem("vibe-theme", dark ? "dark" : "light");
      } catch (error) {}
    }

    var button = document.querySelector(".vibe-theme-toggle");
    if (button) {
      button.addEventListener("click", function () {
        setTheme(document.body.classList.contains("vibe-theme-dark") ? "light" : "dark");
      });
    }

    setTheme(document.body.classList.contains("vibe-theme-dark") ? "dark" : "light");
  })();
</script>
